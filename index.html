<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brooklyn Rooftop Summer Party — Partiful</title>
  <meta name="description" content="You're invited to the Brooklyn Rooftop Summer Party — June 28 in Brooklyn, NY." />
  <meta property="og:title" content="Brooklyn Rooftop Summer Party" />
  <meta property="og:description" content="June 28 · Brooklyn, NY · 47 going · Event full — join the waitlist" />
  <style>
    :root {
      --bg: #0d0b12;
      --card: #15131c;
      --card-2: #1c1925;
      --purple: #7c4dff;
      --purple-soft: #c9a7ff;
      --text: #ffffff;
      --muted: #9a93a8;
      --warn-bg: #3a2d12;
      --warn-border: #6b521f;
      --warn-text: #f4d58a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100%;
    }

    /* ---- Notification banner ---- */
    .banner {
      width: 100%;
      background: var(--warn-bg);
      border-bottom: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      padding: 12px 20px;
    }

    /* ---- Card ---- */
    .wrap {
      width: 100%;
      max-width: 480px;
      padding: 24px 20px 48px;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .cover {
      height: 220px;
      background:
        radial-gradient(120% 120% at 20% 10%, #ff8fce 0%, transparent 55%),
        radial-gradient(120% 120% at 90% 30%, #6ad7ff 0%, transparent 50%),
        linear-gradient(160deg, #7c4dff 0%, #2b1a5e 100%);
      position: relative;
    }

    .cover-emoji {
      position: absolute;
      bottom: 14px;
      left: 18px;
      font-size: 40px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    .body { padding: 22px 22px 26px; }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
    }

    .meta-row .icon { font-size: 16px; width: 20px; text-align: center; }

    /* ---- Guest count ---- */
    .guests {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding: 14px 16px;
      background: var(--card-2);
      border-radius: 14px;
    }

    .avatars { display: flex; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--card-2);
      margin-left: -10px;
      background-size: cover;
    }

    .avatar:first-child { margin-left: 0; }
    .avatar.a1 { background: linear-gradient(135deg, #ff8fce, #ff5fa2); }
    .avatar.a2 { background: linear-gradient(135deg, #6ad7ff, #3b9bff); }
    .avatar.a3 { background: linear-gradient(135deg, #c9a7ff, #7c4dff); }
    .avatar.a4 { background: linear-gradient(135deg, #ffd76a, #ff9f43); }

    .guest-count { font-size: 15px; line-height: 1.4; }
    .guest-count strong { color: var(--purple-soft); }

    .capacity-status { font-size: 13px; color: var(--muted); }
    .capacity-status.full { color: var(--warn-text); font-weight: 600; }

    /* ---- RSVP button ---- */
    .rsvp {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: var(--purple);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .rsvp:hover { background: #8a5cff; }
    .rsvp:active { transform: scale(0.98); }
    .rsvp.going { background: #2f9e57; }

    /* "Join the waitlist" call to action, shown once the event is full. */
    .rsvp.waitlist { background: #b87a1e; }
    .rsvp.waitlist:hover { background: #cd8a2a; }

    /* Confirmed "you're on the waitlist" state. */
    .rsvp.waitlisted { background: var(--warn-bg); color: var(--warn-text); }
    .rsvp.waitlisted:hover { background: #4a3a18; }

    /* ---- Waitlist note ---- */
    .waitlist-note {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .waitlist-note strong { color: var(--warn-text); }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .footer a { color: var(--purple-soft); text-decoration: none; }
  </style>
</head>
<body>
  <div class="banner" role="alert">
    ⚠️ Some guests may not have received confirmation emails — we're working on a fix.
  </div>

  <main class="wrap">
    <article class="card">
      <div class="cover">
        <div class="cover-emoji">🌇🍹</div>
      </div>

      <div class="body">
        <h1>Brooklyn Rooftop Summer Party</h1>

        <div class="meta-row">
          <span class="icon">📅</span>
          <span>Saturday, June 28 · 7:00 PM</span>
        </div>
        <div class="meta-row">
          <span class="icon">📍</span>
          <span>Brooklyn, NY</span>
        </div>

        <div class="guests">
          <div class="avatars">
            <div class="avatar a1"></div>
            <div class="avatar a2"></div>
            <div class="avatar a3"></div>
            <div class="avatar a4"></div>
          </div>
          <div class="guest-count">
            <div>
              <strong id="rsvp-count">47</strong> /
              <span id="capacity">47</span> going
            </div>
            <div class="capacity-status full" id="capacity-status">
              Event full · waitlist open
            </div>
          </div>
        </div>

        <button class="rsvp waitlist" id="rsvp-btn">Join the waitlist</button>

        <p class="waitlist-note" id="waitlist-note">
          <strong>8</strong> on the waitlist
        </p>

        <p class="footer">
          Hosted on <a href="#">Partiful</a> · Throw a party people show up to
        </p>
      </div>
    </article>
  </main>

  <script>
    // RSVP + waitlist interaction. While there are spots left an RSVP joins
    // the going list; once the event is full RSVPs are optimistically routed
    // to the waitlist instead.
    (function () {
      var CAPACITY = 47; // max confirmed guests for this event

      var state = {
        going: 47,            // confirmed guests
        waitlist: 8,          // guests waiting for a spot to free up
        userStatus: 'none',   // 'none' | 'going' | 'waitlisted'
        userWaitlistSpot: 0,  // this user's position once waitlisted
      };

      var btn = document.getElementById('rsvp-btn');
      var countEl = document.getElementById('rsvp-count');
      var capacityEl = document.getElementById('capacity');
      var statusEl = document.getElementById('capacity-status');
      var noteEl = document.getElementById('waitlist-note');

      function spotsLeft() {
        return CAPACITY - state.going;
      }

      function render() {
        countEl.textContent = state.going;
        capacityEl.textContent = CAPACITY;

        var full = spotsLeft() <= 0;

        // Capacity status line under the guest count.
        if (state.userStatus === 'going') {
          statusEl.textContent = "You're going 🎉";
          statusEl.className = 'capacity-status';
        } else if (full) {
          statusEl.textContent = 'Event full · waitlist open';
          statusEl.className = 'capacity-status full';
        } else {
          statusEl.textContent =
            spotsLeft() + (spotsLeft() === 1 ? ' spot left' : ' spots left');
          statusEl.className = 'capacity-status';
        }

        // Waitlist note.
        if (state.userStatus === 'waitlisted') {
          noteEl.hidden = false;
          noteEl.innerHTML =
            "You're <strong>#" + state.userWaitlistSpot + "</strong> of " +
            "<strong>" + state.waitlist + "</strong> on the waitlist";
        } else if (state.waitlist > 0) {
          noteEl.hidden = false;
          noteEl.innerHTML =
            "<strong>" + state.waitlist + "</strong> on the waitlist";
        } else {
          noteEl.hidden = true;
        }

        // RSVP / waitlist button.
        btn.className = 'rsvp';
        if (state.userStatus === 'going') {
          btn.textContent = "You're going! ✓";
          btn.classList.add('going');
        } else if (state.userStatus === 'waitlisted') {
          btn.textContent = 'On the waitlist ✓ — tap to leave';
          btn.classList.add('waitlisted');
        } else if (full) {
          btn.textContent = 'Join the waitlist';
          btn.classList.add('waitlist');
        } else {
          btn.textContent = "RSVP — I'm in 🎉";
        }
      }

      btn.addEventListener('click', function () {
        if (state.userStatus === 'going') {
          // Leaving frees a spot for the next person.
          state.going -= 1;
          state.userStatus = 'none';
        } else if (state.userStatus === 'waitlisted') {
          state.waitlist -= 1;
          state.userStatus = 'none';
          state.userWaitlistSpot = 0;
        } else if (spotsLeft() > 0) {
          state.going += 1;
          state.userStatus = 'going';
        } else {
          state.waitlist += 1;
          state.userStatus = 'waitlisted';
          state.userWaitlistSpot = state.waitlist;
        }
        render();
      });

      render();
    })();
  </script>
</body>
</html>
